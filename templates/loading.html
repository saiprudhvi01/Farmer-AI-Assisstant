{% extends 'base.html' %}{% block title %}FarmMitra{% endblock %}
{% block content %}
<div class="loading-container">
  <div class="loading-content">
    <div class="loading-logo">🌱</div>
    <h1>FarmMitra</h1>
    <p>{{ tr('Your simple farming assistant') }}</p>
    <div class="loading-spinner"></div>
  </div>
</div>

<style>
.loading-container{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:calc(100vh - 76px - 60px);
  text-align:center;
}
.loading-content{
  background:#fff6e0;
  padding:3rem;
  border-radius:20px;
  border:2px solid #e8c98a;
  box-shadow:0 12px 40px #00000033;
  animation:rise 1s ease both;
}
.loading-logo{
  font-size:80px;
  margin-bottom:1rem;
  animation:sway 3s ease-in-out infinite;
  transform-origin:bottom center;
}
.loading-content h1{
  font-family:'Baloo 2','DM Sans',sans-serif;
  font-size:2.5rem;
  color:#3a2a1c;
  margin:0 0 0.5rem;
}
.loading-content p{
  color:#7a6244;
  margin:0 0 2rem;
}
.loading-spinner{
  width:60px;
  height:60px;
  border:4px solid #e8c98a;
  border-top:4px solid #d63c3c;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto;
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes sway{
  0%,100%{transform:rotate(-8deg)}
  50%{transform:rotate(8deg)}
}
@keyframes rise{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}
</style>

<script>
setTimeout(() => {
  window.location.href = '{{ url_for('index') }}';
}, 3000);
</script>
{% endblock %}
