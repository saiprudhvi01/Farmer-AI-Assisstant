{% extends 'base.html' %}{% block title %}{{ tr('Your crop') }} · FarmMitra{% endblock %}
{% block content %}<section class="form-card card"><div class="eyebrow">{{ tr('FIRST, YOUR CROP') }}</div><h1>🌱 {{ tr('Tell us about your crop') }}</h1><p>{{ tr('This helps us tailor farming guidance to you.') }}</p><form method="post" class="stack">
<label>{{ tr('What are you growing?') }} <span class="required">{{ tr('Required') }}</span><select name="crop" required><option value="">{{ tr('Choose a crop') }}</option>{% for crop in ['Tomato','Rice','Cotton','Maize','Chilli','Groundnut','Other'] %}<option value="{{ crop }}">{{ tr(crop) }}</option>{% endfor %}</select></label>
<label>{{ tr('When did you plant it?') }} <span class="required">{{ tr('Required') }}</span><input name="sowing_date" type="date" required value="{{ request.form.get('sowing_date','') }}"></label>
<label>{{ tr('Where is your farm?') }} <span class="required">{{ tr('Required') }}</span><div class="location-row"><input id="location" name="location" placeholder="{{ tr('Village, district, or area') }}" required value="{{ request.form.get('location','') }}"><button class="button secondary small" type="button" onclick="useLocation()">📍 {{ tr('Use my location') }}</button></div><small id="location-help">{{ tr('You can type your village or allow location access.') }}</small></label>
<details><summary>{{ tr('Add optional details') }}</summary><div class="stack details-fields"><label>{{ tr('Crop variety') }}<input name="variety" placeholder="{{ tr('Optional') }}"></label><label>{{ tr('Farm size') }}<input name="farm_size" placeholder="{{ tr('e.g. 2 acres') }}"></label><label>{{ tr('Soil type') }}<select name="soil_type"><option value="">{{ tr('Not sure / skip') }}</option><option value="Black soil">{{ tr('Black soil') }}</option><option value="Red soil">{{ tr('Red soil') }}</option><option value="Alluvial soil">{{ tr('Alluvial soil') }}</option><option value="Sandy soil">{{ tr('Sandy soil') }}</option><option value="Other">{{ tr('Other') }}</option></select></label><label>{{ tr('Irrigation method') }}<select name="irrigation"><option value="">{{ tr('Not sure / skip') }}</option><option value="Drip">{{ tr('Drip') }}</option><option value="Sprinkler">{{ tr('Sprinkler') }}</option><option value="Canal">{{ tr('Canal') }}</option><option value="Borewell">{{ tr('Borewell') }}</option><option value="Rain-fed">{{ tr('Rain-fed') }}</option><option value="Other">{{ tr('Other') }}</option></select></label></div></details>
<button class="button primary" type="submit">{{ tr('Continue') }} <span>→</span></button></form></section><script>
const locationMessages = {
  unavailable: {{ tr('Location is not available in this browser.')|tojson }}, finding: {{ tr('Finding your location…')|tojson }},
  added: {{ tr('Location added. You can edit it if needed.')|tojson }}, coordinates: {{ tr('Coordinates added; please add your village or district for weather advice.')|tojson }},
  failed: {{ tr('Could not get your location. Please type your village or district.')|tojson }}
};
function useLocation(){const help=document.getElementById('location-help');if(!navigator.geolocation){help.textContent=locationMessages.unavailable;return}help.textContent=locationMessages.finding;navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${p.coords.latitude}&lon=${p.coords.longitude}`);const d=await r.json();document.getElementById('location').value=d.address?.village||d.address?.town||d.address?.city||d.address?.county||`${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;help.textContent=locationMessages.added}catch{document.getElementById('location').value=`${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;help.textContent=locationMessages.coordinates}},()=>help.textContent=locationMessages.failed)}
</script>{% endblock %}
